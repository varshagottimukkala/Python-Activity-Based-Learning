<text x="1010" y="573.88" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Print rejection reason</text>
<text x="1010" y="598.36" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Increment rejected count</text>
<rect x="155.0" y="685.0" width="540" height="90" rx="8" fill="#ffffff" stroke="#b5c5b8" stroke-width="2"/>
<text x="425" y="736.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Append accepted product tuple</text>
<polygon points="425,817.0 680.0,880 425,943.0 170.0,880" fill="#fff3d9" stroke="#baa66b" stroke-width="2"/>
<text x="425" y="886.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">More product attempts?</text>
<rect x="155.0" y="985.0" width="540" height="90" rx="8" fill="#ffffff" stroke="#b5c5b8" stroke-width="2"/>
<text x="425" y="1012.66" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">For each accepted tuple:</text>
<text x="425" y="1035.78" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">expected = opening + incoming - dispatch</text>
<text x="425" y="1058.8999999999999" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">difference = observed - expected</text>
<rect x="155.0" y="1135.0" width="540" height="90" rx="8" fill="#ffffff" stroke="#b5c5b8" stroke-width="2"/>
<text x="425" y="1161.6399999999999" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Classify shortage / surplus / match</text>
<text x="425" y="1186.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Replenish only when observed &lt; target</text>
<text x="425" y="1210.6" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Accumulate discrepancy and unit totals</text>
