<text x="425" y="573.88" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">New valid code, whole quantities,</text>
<text x="425" y="598.36" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">and dispatch &lt;= available?</text>
