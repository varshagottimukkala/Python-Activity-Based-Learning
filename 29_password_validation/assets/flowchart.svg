<text x="425" y="1323.8799999999999" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Print each status and every failure</text>
<text x="425" y="1348.36" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Print accepted / rejected totals</text>
<rect x="320.0" y="1454.0" width="210" height="52" rx="26" fill="#1d4938" stroke="none" stroke-width="2"/>
<text x="425" y="1486.12" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">STOP</text>
<text x="52" y="1560" fill="#647569" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Rounded: start / stop     Parallelogram: input / output     Diamond: decision     Rectangle: process</text>
