<text x="425" y="273.88" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Read valid sample count</text>
<text x="425" y="298.36" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Define character and substring policies</text>
<polygon points="177.0,385.0 695.0,385.0 673.0,475.0 155.0,475.0" fill="#edf4ed" stroke="#91ad98" stroke-width="2"/>
<text x="425" y="423.88" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Read username | password</text>
<text x="425" y="448.36" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Start an empty failure list</text>
<polygon points="425,517.0 680.0,580 425,643.0 170.0,580" fill="#fff3d9" stroke="#baa66b" stroke-width="2"/>
