<text x="425" y="736.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Scan character categories and runs</text>
<text x="425" y="760.6" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Collect every failed condition</text>
<rect x="155.0" y="835.0" width="540" height="90" rx="8" fill="#ffffff" stroke="#b5c5b8" stroke-width="2"/>
<text x="425" y="873.88" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Check all prohibited substrings</text>
<text x="425" y="898.36" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">and username without regard to case</text>
<rect x="155.0" y="985.0" width="540" height="90" rx="8" fill="#ffffff" stroke="#b5c5b8" stroke-width="2"/>
<text x="425" y="1011.64" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Store sample result and failure list</text>
<text x="425" y="1036.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Empty list = accepted</text>
<text x="425" y="1060.6" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Otherwise = rejected</text>
<polygon points="425,1117.0 680.0,1180 425,1243.0 170.0,1180" fill="#fff3d9" stroke="#baa66b" stroke-width="2"/>
<text x="425" y="1186.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">More samples?</text>
