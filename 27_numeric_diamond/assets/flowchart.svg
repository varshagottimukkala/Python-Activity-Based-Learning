<text x="425" y="861.64" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Find mirrored level</text>
<text x="425" y="886.12" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">left = size - level + 1</text>
<text x="425" y="910.6" fill="#223b30" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">right = size + level - 1</text>
